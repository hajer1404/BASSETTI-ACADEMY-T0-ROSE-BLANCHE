<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test de positionnement IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Charte BASSETTI : orange EC6408, anthracite 423435 */
  --bg:#F1EFEE;--surface:#FFFFFF;--field:#FAF8F7;--ink:#423435;--muted:#646363;--line:#DED7D5;
  --accent:#EC6408;--accent-ink:#FFFFFF;--accent-soft:#FDF0E4;--accent-mid:#F6AD83;
  --ok:#EC6408;--ok-soft:#FDF0E4;--warn:#878786;--warn-soft:#F2EFEE;--err:#B3261E;
  --brand:#423435;--radius:5px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#191415;--surface:#241E1F;--field:#1E1819;--ink:#F1EDEB;--muted:#A99E9C;--line:#3B3233;
    --accent:#FF7A1F;--accent-ink:#2A2223;--accent-soft:#3A2A1E;--accent-mid:#B5753F;
    --ok:#FF7A1F;--ok-soft:#36261C;--warn:#8B8180;--warn-soft:#2B2526;--err:#F2B8B5;
    --brand:#120E0F;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

/* Bandeau de marque */
.brand{background:#FFFFFF;border-bottom:3px solid #EC6408}
.brand-in{max-width:720px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.brand img{height:52px;width:auto;display:block;flex:none}
.brand .tag{margin-left:auto;color:#878786;font-size:12px;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
@media (max-width:560px){.brand .tag{display:none}.brand img{height:44px}}

.wrap{max-width:720px;margin:0 auto;padding:36px 20px 72px}
header{margin-bottom:26px}
h1{font-size:30px;line-height:1.2;font-weight:600;margin:0;letter-spacing:-.01em}
h1::after{content:"";display:block;width:64px;height:3px;background:var(--accent);margin-top:12px}
.intro{color:var(--muted);margin:14px 0 0;max-width:62ch;white-space:pre-line}
h2{font-size:21px;line-height:1.35;font-weight:600;margin:0 0 18px}
h3{font-size:17px;font-weight:600;margin:30px 0 12px;color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px}
@media (max-width:520px){.panel{padding:20px}.wrap{padding-top:24px}h1{font-size:25px}}
p{margin:0 0 12px}
.muted{color:var(--muted)}

/* Formulaire */
.field{margin-bottom:20px}
.lbl{display:block;font-weight:500;margin-bottom:6px}
.req{color:var(--err)}
.help{font-size:14px;color:var(--muted);margin:-2px 0 8px}
input[type=text],input[type=email],input[type=password],input[type=number],select,textarea{
  width:100%;font:inherit;color:inherit;background:var(--field);
  border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
textarea{min-height:96px;resize:vertical}
select:disabled{opacity:1;color:var(--ink);background:var(--bg);cursor:default}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--err)}
.err-msg{color:var(--err);font-size:14px;margin-top:6px}

/* Boutons */
.btn{font:inherit;font-weight:500;border-radius:var(--radius);padding:11px 22px;cursor:pointer;
  border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:26px;flex-wrap:wrap}
.actions.end{justify-content:flex-end}
.send-err{color:var(--err);font-size:14px;margin-top:14px}

/* Questions */
.progress{margin-bottom:24px}
.count{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  font-size:14px;color:var(--muted);margin-bottom:8px}
.chrono{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .35s ease}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-size:20px;line-height:1.4;font-weight:600;padding:0;margin-bottom:8px}
.multi{font-size:14px;color:var(--muted);margin:0 0 16px}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 14px;cursor:pointer;background:var(--surface);position:relative}
.opt:hover{border-color:var(--accent)}
.opt input{margin:3px 0 0;width:18px;height:18px;flex:none;accent-color:var(--accent)}
.opt input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt .key{position:absolute;right:10px;top:10px;font-size:11px;color:var(--muted);
  border:1px solid var(--line);border-radius:3px;padding:0 5px;line-height:17px}
.opt.on .key{border-color:var(--accent);color:var(--accent)}
@media (max-width:560px){.opt .key{display:none}}
.opt.idk{border-style:dashed;color:var(--muted)}
.opt.idk.on{color:var(--ink)}
.hint{font-size:13px;color:var(--muted);margin:14px 0 0}

/* Reprise de test */
.resume{border-left:3px solid var(--accent);background:var(--accent-soft);
  border-radius:0 var(--radius) var(--radius) 0;padding:16px 18px;margin-bottom:22px}
.resume p{margin:0 0 10px}
.resume .actions{margin-top:0}

/* Bilan */
.result-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 28px;margin-bottom:22px}
.score{font-size:60px;font-weight:600;line-height:1;letter-spacing:-.02em;color:var(--accent)}
.score small{font-size:26px;font-weight:500;margin-left:2px}
.lvl-name{font-size:20px;font-weight:600}
.lvl-code{color:var(--muted)}
.scale{display:grid;gap:4px;margin-bottom:6px}
.scale span{height:10px;border-radius:2px;background:var(--line)}
.scale span.past{background:var(--accent-mid)}
.scale span.now{background:var(--accent)}
.scale-labels{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.scale-labels b{color:var(--ink);font-weight:600}
.axis{display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.axis:last-of-type{border-bottom:0}
.axis .track{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.axis .track i{display:block;height:100%;width:0;background:var(--accent-mid);transition:width .6s ease}
.axis .track i.hi{background:var(--accent)}
.axis .track i.lo{background:#C4B9B9}
.axis .pct{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:520px){.axis{grid-template-columns:minmax(0,1fr) 44px}.axis .track{grid-column:1 / -1;order:3}}
.items{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.items li{border-radius:var(--radius);padding:12px 14px;border-left:3px solid transparent}
.items.good li{background:var(--ok-soft);border-left-color:var(--ok)}
.items.todo li{background:var(--warn-soft);border-left-color:var(--warn)}
.items .mod{display:block;font-size:14px;margin-top:2px;color:var(--muted)}
.topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 16px;margin-top:16px;font-size:14px;color:var(--muted)}
.linkbtn{font:inherit;background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fin{margin-top:28px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);white-space:pre-line}
.ref{font-size:13px;color:var(--muted);margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.corr{border-top:1px solid var(--line);padding:14px 0}
.corr p{margin:4px 0}
.corr .verdict{font-weight:600}
.corr .verdict.ok{color:var(--accent)}
.corr .verdict.ko{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Impression du bilan */
@media print{
  body{background:#fff}
  .brand{border-bottom:3px solid #EC6408}
  .noprint,.topbar,.actions{display:none!important}
  .wrap{padding:0 0 20px}
  .panel{border:0;padding:0}
  .items li{border:1px solid #DED7D5}
  .axis .track i{print-color-adjust:exact;-webkit-print-color-adjust:exact}
}
</style>
</head>

      question: "Avant de soumettre un document du Groupe à un assistant IA, que vérifiez-vous ? (plusieurs réponses)",
      options: ["Que l’outil utilisé est celui autorisé par l’entreprise",
                "Que le document ne contient pas de données personnelles ou confidentielles non couvertes",
                "Que la longueur du document est inférieure à dix pages",
                "Que vous êtes habilité à accéder à ce document",
                "Que le document est rédigé en français"],
      bonnes: "A,B,D",
      explication: "L’outil, la nature des données et vos habilitations. La longueur et la langue ne sont pas des critères de conformité." },

    /* ---------- Application au métier : identifier et arbitrer ---------- */
    { id: "Q26", competence: "meti", type: "unique",
      question: "Parmi ces quatre tâches, laquelle se prête le mieux à une assistance par l’IA ?",
      options: ["Arrêter les comptes de l’exercice",
                "Extraire les obligations et les échéances de trente contrats fournisseurs",
                "Décider du montant d’un investissement",
                "Négocier un délai de paiement avec un client"],
      bonnes: "B",
      explication: "Volume documentaire élevé, règle d’extraction stable, résultat vérifiable : ce sont les trois marqueurs d’une tâche bien adaptée. Les trois autres relèvent de la décision ou de l’engagement." },

    { id: "Q27", competence: "meti", type: "unique",
      question: "Pour décider si une tâche mérite d’être outillée avec l’IA, quel critère est le plus pertinent ?",
      options: ["Le nombre de personnes qui la trouvent pénible",
                "Sa fréquence, le temps qu’elle consomme et la stabilité de la règle qu’elle suit",
                "Son ancienneté dans les procédures de l’entreprise",
                "Le niveau hiérarchique de celui qui la réalise"],
      bonnes: "B",
      explication: "Une tâche rare ou dont la règle change en permanence rapporte peu, même si elle est pénible. Le gain se calcule : fréquence multipliée par temps passé." },

    { id: "Q28", competence: "meti", type: "multiple",
      question: "Lesquelles de ces tâches sont de bons candidats à une assistance par l’IA ? (plusieurs réponses)",
      options: ["Synthétiser un rapport de soixante pages en une note d’une page",
                "Comparer deux versions d’un contrat et lister les écarts",
                "Signer l’attestation remise au commissaire aux comptes",
                "Rapprocher deux listes et faire ressortir les lignes divergentes",
                "Arbitrer entre deux fournisseurs"],
      bonnes: "A,B,D",
      explication: "Synthèse, comparaison et rapprochement sont des travaux de traitement. Signer et arbitrer sont des actes de décision, qui restent entiers." },

    { id: "Q29", competence: "meti", type: "unique",
      question: "Vous hésitez entre un assistant généraliste et un outil spécialisé de votre métier. Quel critère est décisif ?",
      options: ["Le prix de la licence",
                "La nature du besoin : raisonner sur vos propres documents, ou interroger une base de connaissances métier tenue à jour",
                "La notoriété de l’éditeur",
                "La langue de l’interface"],
      bonnes: "B",
      explication: "Un assistant généraliste excelle sur vos documents. Un outil spécialisé apporte une base métier maintenue et des références vérifiables. Le besoin décide, pas l’outil." },

    { id: "Q30", competence: "meti", type: "unique",
      question: "Vous avez identifié un usage prometteur dans votre direction. Quelle est la première étape avant de le déployer ?",
      options: ["Former immédiatement toute l’équipe",
                "Mesurer le temps actuellement consacré à cette tâche, pour pouvoir comparer ensuite",
                "Acheter des licences supplémentaires",
                "Rédiger une procédure complète"],
      bonnes: "B",
      explication: "Sans mesure de départ, aucun gain ne pourra être démontré. C’est la différence entre un ressenti et un résultat opposable." }
  ];

  /* =====================================================================
     2. FONCTIONNEMENT – rien à modifier en dessous
     ===================================================================== */

  const LETTRES = "ABCDEF";
  const app = document.getElementById("app");
  const introEl = document.getElementById("intro");
  let formulaire = null;
  let utilisateur = null;
  const CLE_SESSION = "t0.session";
  const cleIdentite = id => "t0.identite." + id;
  const cleReprise = id => "t0.reprise." + id;
  let chronoTimer = null;
  let identite = {};
  let ordre = [];
  let reponses = {};
  let idx = 0;
  let debut = 0;
  let enCours = false;
  let envoiEnCours = false;

  // Identité envoyée au Google Form, tirée de la liste des participants
  const CHAMPS_IDENTITE = ["nom", "prenom", "email", "direction", "poste"];
  function participant(email) {
    const m = String(email || "").trim().toLowerCase();
    return PARTICIPANTS.find(p => p.email.toLowerCase() === m) || null;
  }
  function nomComplet(p) { return p.prenom + " " + p.nom; }
  function identiteDe(p) {
    const avecFiliale = formulaire && formulaire.map[normaliser("filiale")];
    const v = {
      nom: p.nom, prenom: p.prenom, email: p.email.toLowerCase(), poste: p.poste,
      direction: avecFiliale ? p.equipe : p.equipe + " (" + p.filiale + ")"
    };
    if (avecFiliale) v.filiale = p.filiale;
    return v;
  }
  // Identity built from the editable profile lists (equipe, filiale, nom_prenom, poste, email)
  function identiteDepuisProfil(v) {
    const avecFiliale = formulaire && formulaire.map[normaliser("filiale")];
    const pers = PARTICIPANTS.find(p => nomComplet(p) === v.nom_prenom);
    const morceaux = String(v.nom_prenom || "").trim().split(/\s+/);
    const r = {
      prenom: pers ? pers.prenom : morceaux[0] || "",
      nom: pers ? pers.nom : morceaux.slice(1).join(" "),
      email: String(v.email || "").toLowerCase(), poste: v.poste,
      direction: avecFiliale ? v.equipe : v.equipe + " (" + v.filiale + ")",
      profil: v
    };
    if (avecFiliale) r.filiale = v.filiale;
    return r;
  }

  function el(tag, cls, txt) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  }
  function vider() {
    if (chronoTimer) { clearInterval(chronoTimer); chronoTimer = null; }
    app.innerHTML = "";
    window.scrollTo(0, 0);
  }

  /* ---------- Reprise d'un test interrompu ---------- */
  function sauvegarderProgression() {
    if (!utilisateur || !enCours) return;
    try {
      localStorage.setItem(cleReprise(utilisateur), JSON.stringify({
        v: 1, ordre: ordre.map(q => q.id), reponses: reponses, idx: idx, debut: debut, quand: Date.now()
      }));
    } catch (e) { /* stockage indisponible */ }
  }
  function effacerProgression() {
    try { localStorage.removeItem(cleReprise(utilisateur)); } catch (e) { /* stockage indisponible */ }
  }
  function lireProgression() {
    try {
      const d = JSON.parse(localStorage.getItem(cleReprise(utilisateur)) || "null");
      if (!d || d.v !== 1 || !Array.isArray(d.ordre) || !d.ordre.length) return null;
      if (Date.now() - (d.quand || 0) > 7 * 24 * 3600 * 1000) return null;
      if (!d.ordre.every(id => QUESTIONS.some(q => q.id === id))) return null;
      return d;
    } catch (e) { return null; }
  }
  function construire(ids) {
    return ids.map(id => {
      const q = QUESTIONS.find(x => x.id === id);
      return {
        id: q.id,
        type: q.type === "multiple" ? "multiple" : "unique",
        question: q.question,
        options: q.options.slice(0, LETTRES.length).map((t, i) => ({ lettre: LETTRES[i], texte: t }))
      };
    });
  }
  function reprendre(d) {
    ordre = construire(d.ordre);
    reponses = (d.reponses && typeof d.reponses === "object") ? d.reponses : {};
    idx = Math.min(Math.max(0, d.idx | 0), ordre.length - 1);
    debut = d.debut || Date.now();
    enCours = true;
    ecranQuestion();
  }
  function normaliser(s) {
    return String(s == null ? "" : s).trim().toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
  }
  function melanger(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function afficherIntro(visible) { introEl.hidden = !(visible && CONFIG.intro); }

  function message(titre, texte) {
    vider();
    const p = el("div", "panel");
    p.appendChild(el("h2", null, titre));
    if (texte) p.appendChild(el("p", "muted", texte));
    app.appendChild(p);
  }

  /** Transforme le lien prérempli en adresse d’envoi + correspondance mot-clé -> entry.XXX */
  function lireFormulaire(lien) {
    try {
      const u = new URL(lien);
      if (u.hostname !== "docs.google.com" || !/\/viewform$/.test(u.pathname)) return null;
      const map = {};
      u.searchParams.forEach((v, k) => { if (/^entry\.\d+$/.test(k)) map[normaliser(v)] = k; });
      if (!Object.keys(map).length) return null;
      return { action: u.origin + u.pathname.replace(/\/viewform$/, "/formResponse"), map: map };
    } catch (e) {
      return null;
    }
  }

  /* ---------- Démarrage ---------- */
  function initialiser() {
    document.title = CONFIG.titre;
    document.getElementById("titre").textContent = CONFIG.titre;
    introEl.textContent = CONFIG.intro;
    formulaire = lireFormulaire(CONFIG.lienPrerempli);
    if (!formulaire) {
      message("Configuration incomplète", "Collez le lien prérempli de votre Google Form dans CONFIG.lienPrerempli, en haut du script de index.html.");
      return;
    }
    const absents = CHAMPS_IDENTITE.concat(CHAMPS.map(c => c.id)).filter(id => !formulaire.map[normaliser(id)]);
    if (absents.length) {
      message("Configuration incomplète",
        "Ces informations n’ont pas de question correspondante dans le Google Form : " + absents.join(", ") +
        ". Ajoutez une question par information dans le formulaire, régénérez le lien prérempli en y saisissant exactement ces mots-clés comme valeurs, puis recollez-le dans CONFIG.lienPrerempli. Sans cela, les réponses ne seraient pas enregistrées.");
      return;
    }
    if (!PARTICIPANTS.length || !/^[a-f0-9]{64}$/.test(String(COMPTE_COMMUN.empreinte))) {
      message("Configuration incomplète", "Renseignez PARTICIPANTS et l’empreinte de COMPTE_COMMUN (produite par generateur_empreintes.html).");
      return;
    }
    document.getElementById("deconnexion").addEventListener("click", deconnecter);
    let enregistre = null;
    try { enregistre = sessionStorage.getItem(CLE_SESSION); } catch (e) { /* stockage indisponible */ }
    if (enregistre && participant(enregistre)) {
      ouvrirSession(enregistre);
    } else {
      ecranConnexion();
    }
  }

  /* ---------- Connexion ---------- */
  function empreinte(identifiant, motDePasse) {
    const octets = new TextEncoder().encode("t0|" + identifiant + "|" + motDePasse);
    return crypto.subtle.digest("SHA-256", octets).then(h =>
      Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, "0")).join(""));
  }

  function ecranConnexion() {
    vider();
    afficherIntro(true);
    afficherSession();
    const form = el("form", "panel");
    form.noValidate = true;
    form.appendChild(el("h2", null, "Connexion"));

    // Adresse e-mail : menu déroulant, groupé par équipe
    const fId = el("div", "field");
    const lbId = el("label", "lbl", "Adresse e-mail");
    lbId.htmlFor = "login_id";
    fId.appendChild(lbId);
    fId.appendChild(el("p", "help", "Choisissez votre adresse dans la liste."));
    const sel = el("select");
    sel.id = "login_id";
    const vide = el("option", null, "Choisir…");
    vide.value = "";
    sel.appendChild(vide);
    const equipes = [];
    PARTICIPANTS.forEach(p => { if (!equipes.includes(p.equipe)) equipes.push(p.equipe); });
    equipes.forEach(eq => {
      const g = el("optgroup");
      g.label = eq;
      PARTICIPANTS.filter(p => p.equipe === eq).forEach(p => {
        const op = el("option", null, p.email.toLowerCase());
        op.value = p.email.toLowerCase();
        g.appendChild(op);
      });
      sel.appendChild(g);
    });
    fId.appendChild(sel);
    form.appendChild(fId);

    const fMdp = el("div", "field");
    const lbMdp = el("label", "lbl", "Mot de passe");
    lbMdp.htmlFor = "login_mdp";
    const mdpInput = el("input");
    mdpInput.type = "password";
    mdpInput.id = "login_mdp";
    mdpInput.autocomplete = "current-password";
    fMdp.appendChild(lbMdp);
    fMdp.appendChild(mdpInput);
    form.appendChild(fMdp);
    const err = el("p", "err-msg");
    err.hidden = true;
    err.setAttribute("role", "alert");
    form.appendChild(err);

    const a = el("div", "actions end");
    const b = el("button", "btn", "Se connecter");
    b.type = "submit";
    a.appendChild(b);
    form.appendChild(a);

    form.addEventListener("submit", e => {
      e.preventDefault();
      const id = form.querySelector("#login_id").value.trim().toLowerCase();
      const mdp = form.querySelector("#login_mdp").value;
      if (!id || !mdp) {
        err.textContent = "Choisissez votre adresse e-mail et saisissez le mot de passe.";
        err.hidden = false;
        return;
      }
      b.disabled = true;
      const p = participant(id);
      const perso = p && /^[a-f0-9]{64}$/.test(String(p.empreinte || ""));
      const attendu = perso ? p.empreinte : COMPTE_COMMUN.empreinte;
      empreinte(perso ? id : COMPTE_COMMUN.identifiant, mdp).then(h => {
        if (!p || h !== attendu) {
          b.disabled = false;
          err.textContent = "Mot de passe incorrect.";
          err.hidden = false;
          form.querySelector("#login_mdp").value = "";
          form.querySelector("#login_mdp").focus();
          return;
        }
        try { sessionStorage.setItem(CLE_SESSION, id); } catch (e2) { /* stockage indisponible */ }
        ouvrirSession(id);
      }).catch(() => {
        b.disabled = false;
        err.textContent = "La connexion n’a pas pu être vérifiée. Ouvrez le test depuis son lien https, puis réessayez.";
        err.hidden = false;
      });
    });
    app.appendChild(form);
    form.querySelector("#login_id").focus();
  }

  function afficherSession() {
    const bar = document.getElementById("session");
    bar.hidden = !utilisateur;
    const p = participant(utilisateur);
    document.getElementById("session-nom").textContent = utilisateur ? "Connecté en tant que " + (p ? nomComplet(p) : utilisateur) : "";
  }

  function deconnecter() {
    if (enCours && !window.confirm("Votre test en cours sera mis en pause. Vous pourrez le reprendre à la prochaine connexion, sur ce même navigateur. Continuer ?")) return;
    if (enCours) sauvegarderProgression();
    try { sessionStorage.removeItem(CLE_SESSION); } catch (e) { /* stockage indisponible */ }
    utilisateur = null;
    identite = {};
    reponses = {};
    enCours = false;
    ecranConnexion();
  }

  function ouvrirSession(id) {
    utilisateur = id;
    identite = {};
    try {
      const sauve = JSON.parse(localStorage.getItem(cleIdentite(id)) || "null");
      if (sauve && typeof sauve === "object") identite = sauve;
    } catch (e) { /* stockage indisponible */ }
    const p = participant(id);
    // Values the candidate already edited take priority over the participant list
    if (p) identite = Object.assign(identiteDe(p), identite);
    afficherSession();
    const d = lireProgression();
    if (d) { ecranReprise(d); return; }
    ecranIdentite();
  }

  /* ---------- Écran de reprise ---------- */
  function ecranReprise(d) {
    vider();
    afficherIntro(false);
    const p = el("div", "panel");
    p.appendChild(el("h2", null, "Vous avez un test en cours"));
    const n = QUESTIONS.length;
    const fait = Object.keys(d.reponses || {}).length;
    const box = el("div", "resume");
    box.appendChild(el("p", null,
      "Votre test précédent s'est interrompu à la question " + Math.min((d.idx | 0) + 1, n) +
      " sur " + n + " (" + fait + " réponse" + (fait > 1 ? "s" : "") + " enregistrée" + (fait > 1 ? "s" : "") + ")."));
    const a = el("div", "actions");
    const bRe = el("button", "btn", "Reprendre où je me suis arrêté");
    bRe.type = "button";
    bRe.addEventListener("click", () => reprendre(d));
    const bNew = el("button", "btn ghost", "Recommencer depuis le début");
    bNew.type = "button";
    bNew.addEventListener("click", () => {
      if (!window.confirm("Vos réponses enregistrées seront effacées. Continuer ?")) return;
      effacerProgression();
      ecranIdentite();
    });
    a.appendChild(bRe);
    a.appendChild(bNew);
    box.appendChild(a);
    p.appendChild(box);
    app.appendChild(p);
  }

  /* ---------- Écran 1 : informations du candidat ---------- */
  function ecranIdentite() {
    vider();
    afficherIntro(true);
    const form = el("form", "panel");
    form.noValidate = true;
    form.appendChild(el("h2", null, "Vos informations"));

    const moi = participant(utilisateur);
    if (moi) {
      form.appendChild(el("p", "help", "Ces informations viennent de la liste des participants. Vérifiez-les et modifiez-les si besoin."));
      const profil = identite.profil || {};
      [
        { id: "equipe", libelle: "Équipe", val: p => p.equipe },
        { id: "filiale", libelle: "Filiale", val: p => p.filiale },
        { id: "nom_prenom", libelle: "Nom et prénom", val: p => nomComplet(p) },
        { id: "poste", libelle: "Poste", val: p => p.poste },
        { id: "email", libelle: "Adresse e-mail", val: p => p.email.toLowerCase() }
      ].forEach(c => {
        const f = el("div", "field");
        const lb = el("label", "lbl", c.libelle);
        lb.htmlFor = "profil_" + c.id;
        f.appendChild(lb);
        const s = el("select");
        s.id = "profil_" + c.id;
        s.name = c.id;
        s.dataset.profil = c.id;
        const vals = [];
        PARTICIPANTS.forEach(p => { const v = c.val(p); if (!vals.includes(v)) vals.push(v); });
        vals.forEach(v => { const op = el("option", null, v); op.value = v; s.appendChild(op); });
        s.value = vals.includes(profil[c.id]) ? profil[c.id] : c.val(moi);
        f.appendChild(s);
        form.appendChild(f);
      });
      const pasMoi = el("p", "help");
      pasMoi.appendChild(document.createTextNode("Ce n’est pas vous ? "));
      const lien = el("button", "linkbtn", "Se déconnecter");
      lien.type = "button";
      lien.addEventListener("click", deconnecter);
      pasMoi.appendChild(lien);
      form.appendChild(pasMoi);
      form.appendChild(el("h3", null, "Votre usage de l’IA"));
    }

    CHAMPS.forEach(c => {
      const f = el("div", "field");
      f.dataset.id = c.id;
      const id = "champ_" + c.id;
      const lb = el("label", "lbl", c.libelle);
      lb.htmlFor = id;
      if (c.obligatoire) {
        const s = el("span", "req", " *");
        s.setAttribute("aria-hidden", "true");
        lb.appendChild(s);
      }
      f.appendChild(lb);
      if (c.aide) f.appendChild(el("p", "help", c.aide));

      let input;
      if (c.type === "liste") {
        input = el("select");
        const vide = el("option", null, "Choisir…");
        vide.value = "";
        input.appendChild(vide);
        (c.options || []).forEach(o => { const op = el("option", null, o); op.value = o; input.appendChild(op); });
      } else if (c.type === "texte_long") {
        input = el("textarea");
      } else {
        input = el("input");
        input.type = c.type === "email" ? "email" : c.type === "nombre" ? "number" : "text";
        if (c.type === "email") input.autocomplete = "email";
      }
      input.id = id;
      input.name = c.id;
      if (c.obligatoire) input.setAttribute("aria-required", "true");
      input.value = identite[c.id] || "";
      f.appendChild(input);
      form.appendChild(f);
    });

    const a = el("div", "actions end");
    const b = el("button", "btn", "Commencer le test");
    b.type = "submit";
    a.appendChild(b);
    form.appendChild(a);

    form.addEventListener("submit", e => {
      e.preventDefault();
      if (validerIdentite(form)) demarrer();
    });
    app.appendChild(form);
  }

  function validerIdentite(form) {
    let premier = null;
    const valeurs = {};
    CHAMPS.forEach(c => {
      const f = form.querySelector('.field[data-id="' + c.id + '"]');
      const input = f.querySelector("input,select,textarea");
      const ancien = f.querySelector(".err-msg");
      if (ancien) ancien.remove();
      f.classList.remove("invalid");
      input.removeAttribute("aria-invalid");

      const v = input.value.trim().slice(0, 500);
      let erreur = "";
      if (c.obligatoire && !v) erreur = "Ce champ est obligatoire.";
      else if (c.type === "email" && v && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) erreur = "Saisissez une adresse mail valide, par exemple prenom.nom@entreprise.com.";
      if (erreur) {
        f.classList.add("invalid");
        input.setAttribute("aria-invalid", "true");
        const m = el("p", "err-msg", erreur);
        m.id = input.id + "_err";
        input.setAttribute("aria-describedby", m.id);
        f.appendChild(m);
        if (!premier) premier = input;
      }
      valeurs[c.id] = c.type === "email" ? v.toLowerCase() : v;
    });
    if (premier) { premier.focus(); return false; }
    const moi = participant(utilisateur);
    const selects = form.querySelectorAll("select[data-profil]");
    let ident = moi ? identiteDe(moi) : {};
    if (moi && selects.length) {
      const profil = {};
      selects.forEach(s => { profil[s.dataset.profil] = s.value; });
      ident = identiteDepuisProfil(profil);
    }
    identite = Object.assign(valeurs, ident);
    try { localStorage.setItem(cleIdentite(utilisateur), JSON.stringify(valeurs)); } catch (e) { /* stockage indisponible */ }
    return true;
  }

  function demarrer() {
    const base = QUESTIONS.map(q => ({
      id: q.id,
      type: q.type === "multiple" ? "multiple" : "unique",
      question: q.question,
      options: q.options.slice(0, LETTRES.length).map((t, i) => ({ lettre: LETTRES[i], texte: t }))
    }));
    ordre = (CONFIG.melangerQuestions ? melanger(base) : base).map(q => {
      if (CONFIG.melangerOptions) q.options = melanger(q.options);
      return q;
    });
    reponses = {};
    idx = 0;
    debut = Date.now();
    enCours = true;
    effacerProgression();
    sauvegarderProgression();
    ecranQuestion();
  }

  /* ---------- Écran 2 : les questions ---------- */
  function ecranQuestion() {
    vider();
    afficherIntro(false);
    const q = ordre[idx];
    const n = ordre.length;
    const p = el("div", "panel");

    const pr = el("div", "progress");
    const cnt = el("div", "count");
    cnt.appendChild(el("span", null, "Question " + (idx + 1) + " sur " + n));
    const chrono = el("span", "chrono", "");
    cnt.appendChild(chrono);
    pr.appendChild(cnt);
    function majChrono() {
      const s = Math.max(0, Math.floor((Date.now() - debut) / 1000));
      chrono.textContent = Math.floor(s / 60) + " min " + String(s % 60).padStart(2, "0") + " s";
    }
    majChrono();
    chronoTimer = setInterval(majChrono, 1000);
    const bar = el("div", "bar");
    bar.setAttribute("role", "progressbar");
    bar.setAttribute("aria-valuemin", "0");
    bar.setAttribute("aria-valuemax", String(n));
    bar.setAttribute("aria-valuenow", String(idx + 1));
    const fill = el("i");
    fill.style.width = (idx / n * 100) + "%";
    bar.appendChild(fill);
    pr.appendChild(bar);
    p.appendChild(pr);

    const fs = el("fieldset");
    fs.appendChild(el("legend", null, q.question));
    if (q.type === "multiple") fs.appendChild(el("p", "multi", "Plusieurs réponses possibles."));
    const opts = el("div", "opts");
    const type = q.type === "multiple" ? "checkbox" : "radio";
    const liste = q.options.map(o => ({ valeur: o.lettre, texte: o.texte, idk: false }));
    if (CONFIG.jeNeSaisPas) liste.push({ valeur: "?", texte: "Je ne sais pas", idk: true });

    const labels = [];
    liste.forEach(o => {
      const lb = el("label", "opt" + (o.idk ? " idk" : ""));
      const inp = el("input");
      inp.type = type;
      inp.name = "q";
      inp.value = o.valeur;
      lb.appendChild(inp);
      lb.appendChild(el("span", null, o.texte));
      const touche = o.idk ? "0" : String(labels.length + 1);
      const k = el("span", "key", touche);
      k.setAttribute("aria-hidden", "true");
      lb.appendChild(k);
      opts.appendChild(lb);
      labels.push({ lb, inp, touche });
    });
    fs.appendChild(opts);
    p.appendChild(fs);

    const a = el("div", "actions");
    const prec = el("button", "btn ghost", "Précédent");
    prec.type = "button";
    prec.disabled = idx === 0;
    prec.addEventListener("click", () => { idx--; ecranQuestion(); });
    const dernier = idx === n - 1;
    const suiv = el("button", "btn", dernier ? "Envoyer mes réponses" : "Question suivante");
    suiv.type = "button";
    a.appendChild(prec);
    a.appendChild(suiv);
    p.appendChild(a);
    const err = el("p", "send-err");
    err.hidden = true;
    p.appendChild(err);

    function synchroniser() {
      const sel = reponses[q.id] || [];
      labels.forEach(({ lb, inp }) => {
        inp.checked = sel.indexOf(inp.value) !== -1;
        lb.classList.toggle("on", inp.checked);
      });
      suiv.disabled = sel.length === 0;
    }
    labels.forEach(({ inp }) => {
      inp.addEventListener("change", () => {
        let sel = reponses[q.id] || [];
        if (type === "radio" || inp.value === "?") {
          sel = inp.checked ? [inp.value] : [];
        } else {
          sel = sel.filter(v => v !== "?");
          if (inp.checked) { if (sel.indexOf(inp.value) === -1) sel.push(inp.value); }
          else sel = sel.filter(v => v !== inp.value);
        }
        reponses[q.id] = sel;
        sauvegarderProgression();
        synchroniser();
      });
    });
    synchroniser();

    suiv.addEventListener("click", () => {
      if (!dernier) { idx++; sauvegarderProgression(); ecranQuestion(); return; }
      envoyer(suiv, err);
    });

    p.appendChild(el("p", "hint",
      "Raccourcis : touches " + (CONFIG.jeNeSaisPas ? "1 à " + (labels.length - 1) + " ou 0" : "1 à " + labels.length) +
      " pour répondre, Entrée pour continuer, flèche gauche pour revenir."));

    function clavier(e) {
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      const t = e.target;
      if (t && (t.tagName === "INPUT" && t.type === "text" || t.tagName === "TEXTAREA" || t.tagName === "SELECT")) return;
      if (e.key === "Enter") {
        if (!suiv.disabled) { e.preventDefault(); suiv.click(); }
        return;
      }
      if (e.key === "ArrowLeft" && !prec.disabled) { e.preventDefault(); prec.click(); return; }
      const cible = labels.filter(l => l.touche === e.key)[0];
      if (cible) {
        e.preventDefault();
        if (type === "radio") { cible.inp.checked = true; }
        else { cible.inp.checked = !cible.inp.checked; }
        cible.inp.dispatchEvent(new Event("change", { bubbles: true }));
      }
    }
    document.addEventListener("keydown", clavier);
    const stop = new MutationObserver(() => {
      if (!document.body.contains(p)) { document.removeEventListener("keydown", clavier); stop.disconnect(); }
    });
    stop.observe(app, { childList: true });

    app.appendChild(p);
    requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.width = ((idx + 1) / n * 100) + "%"; }));
  }

  /* ---------- Correction ---------- */
  function corriger() {
    const parComp = {};
    let obtenu = 0;
    let total = 0;
    const detail = [];
    const correction = [];

    QUESTIONS.forEach(q => {
      const options = q.options.slice(0, LETTRES.length);
      const valides = options.map((t, i) => LETTRES[i]);
      const texte = l => { const i = LETTRES.indexOf(l); return options[i] != null ? l + ". " + options[i] : l; };
      let rep = (reponses[q.id] || []).slice();
      const nsp = rep.indexOf("?") !== -1;
      rep = rep.filter((x, i, arr) => valides.indexOf(x) !== -1 && arr.indexOf(x) === i).sort();
      if (q.type !== "multiple") rep = rep.slice(0, 1);
      const bonnes = String(q.bonnes || "").toUpperCase().split(/[^A-F]+/).filter(Boolean).sort();
      const juste = rep.length > 0 && rep.length === bonnes.length && rep.every((x, k) => x === bonnes[k]);

      const c = q.competence || "general";
      if (!parComp[c]) parComp[c] = { obtenu: 0, total: 0 };
      parComp[c].total += 1;
      total += 1;
      if (juste) { parComp[c].obtenu += 1; obtenu += 1; }

      detail.push(q.id + " : " + (rep.length ? rep.join(",") : nsp ? "Je ne sais pas" : "Sans réponse") + (juste ? " ✓" : " ✗"));
      correction.push({
        question: q.question,
        juste: juste,
        votre: rep.length ? rep.map(texte) : [nsp ? "Je ne sais pas" : "Sans réponse"],
        bonnes: bonnes.map(texte),
        explication: q.explication || ""
      });
    });

    const pct = (o, t) => t ? Math.round(100 * o / t) : 0;
    const codes = COMPETENCES.map(c => c.code);
    const ordreComp = codes.concat(Object.keys(parComp).filter(k => codes.indexOf(k) === -1));
    const axes = ordreComp.filter(k => parComp[k]).map(k => {
      const c = COMPETENCES.find(x => x.code === k) || { libelle: k, module: "" };
      return { code: k, libelle: c.libelle, module: c.module, score: pct(parComp[k].obtenu, parComp[k].total) };
    });
    const score = pct(obtenu, total);
    let niveau = NIVEAUX[0];
    NIVEAUX.forEach(x => { if (score >= x.min) niveau = x; });

    return {
      score: score,
      niveau: niveau,
      axes: axes,
      forces: axes.filter(a => a.score >= CONFIG.seuilFort).sort((a, b) => b.score - a.score),
      faiblesses: axes.filter(a => a.score < CONFIG.seuilFaible).sort((a, b) => a.score - b.score),
      detail: detail,
      correction: correction,
      duree: Math.round((Date.now() - debut) / 6000) / 10
    };
  }

  /* ---------- Envoi vers le Google Form ---------- */
  function envoyer(btn, err) {
    if (envoiEnCours) return;
    envoiEnCours = true;
    btn.disabled = true;
    btn.textContent = "Envoi en cours…";
    err.hidden = true;

    const r = corriger();
    const valeurs = Object.assign({}, identite, {
      score: r.score,
      niveau: r.niveau.code + " – " + r.niveau.nom,
      competences: r.axes.map(a => a.libelle + " : " + a.score + " %").join(" | "),
      points_forts: r.forces.map(a => a.libelle).join(", "),
      a_travailler: r.faiblesses.map(a => a.libelle).join(", "),
      detail: r.detail.join(" | "),
      duree: r.duree
    });
    r.axes.forEach(a => { valeurs[a.code] = a.score; });
    valeurs.identifiant = utilisateur;

    const data = new URLSearchParams();
    Object.keys(valeurs).forEach(k => {
      const entry = formulaire.map[normaliser(k)];
      if (entry) data.append(entry, String(valeurs[k]));
    });

    fetch(formulaire.action, { method: "POST", mode: "no-cors", body: data })
      .then(() => {
        envoiEnCours = false;
        enCours = false;
        effacerProgression();
        ecranBilan(r);
      })
      .catch(() => {
        envoiEnCours = false;
        btn.disabled = false;
        btn.textContent = "Envoyer mes réponses";
        err.textContent = "L’envoi a échoué. Vos réponses sont conservées sur cette page : vérifiez votre connexion internet, puis cliquez de nouveau sur « Envoyer mes réponses ».";
        err.hidden = false;
      });
  }

  /* ---------- Écran 3 : le bilan ---------- */
  function ecranBilan(r) {
    vider();
    afficherIntro(false);
    const p = el("div", "panel");
    p.appendChild(el("h2", null, "Votre bilan" + (identite.prenom ? ", " + identite.prenom : "")));

    const head = el("div", "result-head");
    const sc = el("div", "score", String(r.score));
    sc.appendChild(el("small", null, "%"));
    head.appendChild(sc);
    const lv = el("div");
    lv.appendChild(el("div", "lvl-name", r.niveau.nom));
    lv.appendChild(el("div", "lvl-code", "Niveau " + r.niveau.code));
    head.appendChild(lv);
    p.appendChild(head);

    const pos = NIVEAUX.indexOf(r.niveau);
    const cols = "repeat(" + NIVEAUX.length + ",1fr)";
    const scale = el("div", "scale");
    scale.style.gridTemplateColumns = cols;
    scale.setAttribute("aria-hidden", "true");
    const labels = el("div", "scale-labels");
    labels.style.gridTemplateColumns = cols;
    NIVEAUX.forEach((x, i) => {
      scale.appendChild(el("span", i === pos ? "now" : i < pos ? "past" : ""));
      labels.appendChild(el(i === pos ? "b" : "span", null, x.nom));
    });
    p.appendChild(scale);
    p.appendChild(labels);

    p.appendChild(el("h3", null, "Résultats par compétence"));
    const fills = [];
    r.axes.forEach(a => {
      const row = el("div", "axis");
      row.appendChild(el("div", null, a.libelle));
      const tr = el("div", "track");
      const f = el("i", a.score >= CONFIG.seuilFort ? "hi" : a.score < CONFIG.seuilFaible ? "lo" : "");
      tr.appendChild(f);
      row.appendChild(tr);
      row.appendChild(el("div", "pct", a.score + " %"));
      p.appendChild(row);
      fills.push([f, a.score]);
    });

    p.appendChild(el("h3", null, "Vos points forts"));
    if (r.forces.length) {
      const ul = el("ul", "items good");
      r.forces.forEach(a => ul.appendChild(el("li", null, a.libelle + " (" + a.score + " %)")));
      p.appendChild(ul);
    } else {
      p.appendChild(el("p", "muted", "Aucune compétence n’atteint encore " + CONFIG.seuilFort + " %. Le parcours vous aidera à progresser sur chacune d’elles."));
    }

    p.appendChild(el("h3", null, "À travailler en priorité"));
    if (r.faiblesses.length) {
      const ul = el("ul", "items todo");
      r.faiblesses.forEach(a => {
        const li = el("li", null, a.libelle + " (" + a.score + " %)");
        if (a.module) li.appendChild(el("span", "mod", "Module conseillé : " + a.module));
        ul.appendChild(li);
      });
      p.appendChild(ul);
    } else {
      p.appendChild(el("p", "muted", "Aucune compétence n’est en dessous du seuil. Vous pouvez suivre le parcours selon vos priorités."));
    }

    if (CONFIG.afficherCorrection) {
      p.appendChild(el("h3", null, "Correction"));
      r.correction.forEach((c, i) => {
        const d = el("div", "corr");
        d.appendChild(el("p", null, (i + 1) + ". " + c.question));
        d.appendChild(el("p", "verdict " + (c.juste ? "ok" : "ko"), c.juste ? "Bonne réponse" : "Réponse incorrecte"));
        d.appendChild(el("p", "muted", "Votre réponse : " + c.votre.join(" ; ")));
        if (!c.juste) d.appendChild(el("p", "muted", "Réponse attendue : " + c.bonnes.join(" ; ")));
        if (c.explication) d.appendChild(el("p", null, c.explication));
        p.appendChild(d);
      });
    }

    if (CONFIG.messageFin) p.appendChild(el("p", "fin", CONFIG.messageFin));

    const ref = el("p", "ref");
    const d = new Date();
    const deuxCh = x => String(x).padStart(2, "0");
    ref.textContent = "Passé le " + deuxCh(d.getDate()) + "/" + deuxCh(d.getMonth() + 1) + "/" + d.getFullYear() +
      " à " + deuxCh(d.getHours()) + "h" + deuxCh(d.getMinutes()) +
      " · Durée : " + r.duree + " min · Référence : " + utilisateur;
    p.appendChild(ref);

    const aFin = el("div", "actions end noprint");
    const bImp = el("button", "btn ghost", "Imprimer ou enregistrer en PDF");
    bImp.type = "button";
    bImp.addEventListener("click", () => window.print());
    aFin.appendChild(bImp);
    p.appendChild(aFin);

    app.appendChild(p);
    requestAnimationFrame(() => requestAnimationFrame(() => fills.forEach(([f, s]) => { f.style.width = s + "%"; })));
  }

  window.addEventListener("beforeunload", e => {
    if (enCours) { e.preventDefault(); e.returnValue = ""; }
  });

  initialiser();
})();
</script>
</body>
